name: Deploy to Server

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/weltreise-server:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: se2-demo.aau.at
          username: grp-1
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 53200
          source: "docker-compose.yml"
          target: "/home/grp-1/weltreise"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: se2-demo.aau.at
          username: grp-1
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 53200
          envs: GITHUB_TOKEN,REGISTRY_USER
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            cd /home/grp-1/weltreise
            export REGISTRY_USER="$REGISTRY_USER"
            docker compose pull
            docker compose up -d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.repository_owner }}
